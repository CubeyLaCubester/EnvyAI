<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnvyAI</title>
  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --bg-card: #282a2c;
      --text-main: #e3e3e3;
      --text-sub: #c4c7c5;
      --accent-blue: #a8c7fa;
      --user-msg-bg: #2b2c2e;
      --border-color: #444746;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid var(--border-color); }
    .brand { font-size: 1.2rem; font-weight: 600; color: var(--accent-blue); margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
    .setting-box { margin-bottom: 16px; }
    .setting-box label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
    .setting-box input, .setting-box select { width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 0.85rem; outline: none; }
    .setting-box input:focus, .setting-box select:focus { border-color: var(--accent-blue); }
    
    /* Main Content Area */
    .main-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .chat-container { flex: 1; overflow-y: auto; padding: 40px 15% 20px 15%; display: flex; flex-direction: column; gap: 24px; }
    
    .message { display: flex; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; line-height: 1.6; }
    .message.user { justify-content: flex-end; }
    .message-content { padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; }
    .message.user .message-content { background-color: var(--user-msg-bg); color: #fff; border-bottom-right-radius: 4px; }
    .message.ai .message-content { background-color: transparent; color: var(--text-main); width: 100%; }

    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
    .ai .avatar { background: linear-gradient(135deg, #1a73e8, #a8c7fa); color: white; }
    
    /* Input Area */
    .input-container { padding: 0 15% 30px 15%; }
    .input-box { background-color: var(--bg-card); border-radius: 28px; display: flex; align-items: center; padding: 8px 16px; border: 1px solid var(--border-color); }
    .input-box input { flex: 1; background: transparent; border: none; outline: none; color: white; padding: 12px; font-size: 1rem; }
    .input-box button { background: var(--accent-blue); border: none; color: #040c17; font-weight: 600; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: opacity 0.2s; }
    .input-box button:hover { opacity: 0.9; }

    /* Empty state welcome screen */
    .welcome { text-align: center; margin-top: auto; margin-bottom: auto; }
    .welcome h1 { font-size: 2.5rem; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b51e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .welcome p { color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">✨ Gemini Studio</div>
    
    <div class="setting-box">
      <label for="apiKey">Groq API Key</label>
      <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
    </div>

    <div class="setting-box">
      <label for="modelSelect">AI Model</label>
      <select id="modelSelect">
        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
        <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
      </select>
    </div>
  </div>

  <div class="main-container">
    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcomeScreen">
        <h1>Hello there</h1>
        <p>Enter your API key on the left to start chatting.</p>
      </div>
    </div>

    <div class="input-container">
      <div class="input-box">
        <input type="text" id="userInput" placeholder="Ask Gemini..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('user_groq_key') || '';

  function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('user_groq_key', key);
  }

  async function sendMessage() {
    const keyInput = document.getElementById('apiKey').value.trim();
    const modelChoice = document.getElementById('modelSelect').value;
    const promptInput = document.getElementById('userInput');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const prompt = promptInput.value.trim();

    if (!keyInput) {
      alert("Please enter your Groq API key in the left sidebar.");
      return;
    }
    if (!prompt) return;

    if (welcomeScreen) welcomeScreen.style.display = 'none';

    chatContainer.innerHTML += `
      <div class="message user">
        <div class="message-content">${escapeHtml(prompt)}</div>
      </div>
    `;

    promptInput.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    const aiMsgId = 'ai-' + Date.now();
    chatContainer.innerHTML += `
      <div class="message ai">
        <div class="avatar">✦</div>
        <div class="message-content" id="${aiMsgId}">Thinking...</div>
      </div>
    `;
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${keyInput}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: modelChoice,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();
      const aiTarget = document.getElementById(aiMsgId);

      if (data.choices && data.choices[0]) {
        aiTarget.innerHTML = formatText(data.choices[0].message.content);
      } else {
        aiTarget.innerText = "Error: " + (data.error?.message || "Invalid response from API.");
      }
    } catch (err) {
      document.getElementById(aiMsgId).innerText = "Network Error: Request was blocked by network or failed to reach API.";
    }

    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function formatText(str) {
    return escapeHtml(str).replace(/\n/g, '<br>');
  }
</script>

</body>
</html>
